[project]
name = "osiris-menu-be"
version = "0.1.0"
description = "Backend del sistema operativo integral del restaurante-cervecería Asiringui (Cuenca, Ecuador)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Asiringui" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "osiris"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle (PEP 8) · F: pyflakes · I: orden de imports
# UP: pyupgrade · B: bugbear · N: convenciones de nombres · FA: future-annotations
select = ["E", "W", "F", "I", "UP", "B", "N", "FA"]

[tool.ruff.lint.isort]
# stdlib → terceros → propios, según convención del proyecto.
known-first-party = ["osiris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` explícito en sys.path: el editable install vía `.pth` no es honrado si
# la ruta del proyecto contiene espacios (limitación de site.py de CPython).
pythonpath = ["src"]
addopts = "-ra"
